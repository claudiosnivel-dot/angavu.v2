# Spec XcodeGen dell'app Angavu iOS (progetto Xcode text-based, verificabile).
# Genera Angavu.xcodeproj che referenzia il package SwiftPM locale.
#   xcodegen generate --spec App/project.yml
name: Angavu
options:
  bundleIdPrefix: com.angavu
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: ../Config/Shared.xcconfig
  Release: ../Config/Shared.xcconfig
packages:
  Angavu:
    path: ..
targets:
  Angavu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - project.yml
          # FSE-J0 — il target UITest (Livello B) ha le sue sorgenti: NON vanno
          # compilate nel bundle dell'app (importano XCTest e girano nel test bundle).
          - AngavuUITests
          # L'Info.plist NON va tra le risorse: se copiato grezzo nel bundle
          # scavalca il "Process Info.plist" (niente sostituzione di $(...) né
          # iniezione di CFBundleExecutable/MinimumOSVersion/UIDeviceFamily) →
          # .ipa senza eseguibile dichiarato = «formato non adatto» su AltStore.
          # Deve restare SOLO come INFOPLIST_FILE (processato).
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angavu.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Icona app: senza `Assets.car`/CFBundleIcons la firma di AltStore/Sideloadly
        # può fallire l'installazione. L'asset catalog (App/Assets.xcassets) è già tra
        # le sources; qui diciamo a Xcode quale set usare → compila l'icona e inietta
        # CFBundleIcons/CFBundleIconName nell'Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Angavu
        product: AngavuFeatures
      - package: Angavu
        product: AngavuDomain
      - package: Angavu
        product: AngavuData

  # FSE-J0 (Livello B) — target UITest che ESEGUE l'app sul Simulatore in CI.
  # XcodeGen aggancia automaticamente i test target che dipendono dall'app allo
  # scheme auto-generato dell'app: `xcodebuild test -scheme Angavu` esegue questi
  # UITest senza dover definire uno scheme esplicito (lo scheme `Angavu` usato da
  # ipa/release resta intatto). `TEST_TARGET_NAME` lega il bundle UI all'app sotto test.
  AngavuUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AngavuUITests
    dependencies:
      - target: Angavu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angavu.uitests
        TEST_TARGET_NAME: Angavu
        # Nessuna firma in CI (come il job ios-app): il Simulatore non la richiede.
        CODE_SIGNING_ALLOWED: NO
