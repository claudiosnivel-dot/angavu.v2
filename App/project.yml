# Spec XcodeGen dell'app Angavu iOS (progetto Xcode text-based, verificabile).
# Genera Angavu.xcodeproj che referenzia il package SwiftPM locale.
#   xcodegen generate --spec App/project.yml
name: Angavu
options:
  bundleIdPrefix: com.angavu
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: ../Config/Shared.xcconfig
  Release: ../Config/Shared.xcconfig
packages:
  Angavu:
    path: ..
targets:
  Angavu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - project.yml
          # L'Info.plist NON va tra le risorse: se copiato grezzo nel bundle
          # scavalca il "Process Info.plist" (niente sostituzione di $(...) né
          # iniezione di CFBundleExecutable/MinimumOSVersion/UIDeviceFamily) →
          # .ipa senza eseguibile dichiarato = «formato non adatto» su AltStore.
          # Deve restare SOLO come INFOPLIST_FILE (processato).
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angavu.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Icona app: senza `Assets.car`/CFBundleIcons la firma di AltStore/Sideloadly
        # può fallire l'installazione. L'asset catalog (App/Assets.xcassets) è già tra
        # le sources; qui diciamo a Xcode quale set usare → compila l'icona e inietta
        # CFBundleIcons/CFBundleIconName nell'Info.plist.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Angavu
        product: AngavuFeatures
      - package: Angavu
        product: AngavuDomain
      - package: Angavu
        product: AngavuData
