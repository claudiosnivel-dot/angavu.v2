# Release iOS — produce un .ipa firmato in DEVELOPMENT, installabile su un iPhone
# in "modalità sviluppatore". Gira SOLO on-demand (workflow_dispatch) su runner
# macOS, e SOLO se i secret di firma Apple sono presenti (vedi docs/INSTALL-iOS.md).
#
# Onestà (L-COL-002/006): il binario è prodotto da xcodebuild sul runner Apple,
# non da una dichiarazione. Nessun segreto vive nel repo: certificato, provisioning
# profile e Team ID arrivano dai GitHub Secrets a runtime e vengono ripuliti a fine job.
#
# Caveat firma: una build development scade (profilo/certificato di solito 1 anno con
# Apple Developer Program a pagamento; 7 giorni con team personale free). Il device di
# destinazione DEVE essere incluso nel provisioning profile. Distribuzione App Store
# = percorso separato (metodo app-store), fuori da questo workflow.

name: Release iOS (.ipa development)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Nota per questa build (facoltativa)"
        required: false
        default: ""

jobs:
  ipa:
    name: build .ipa firmato (development)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Fallisce SUBITO con un messaggio chiaro se manca un secret obbligatorio,
      # invece di rompersi a metà dell'archiviazione.
      - name: Verifica secret presenti
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          missing=0
          for v in BUILD_CERTIFICATE_BASE64 BUILD_PROVISION_PROFILE_BASE64 DEVELOPMENT_TEAM; do
            if [ -z "${!v}" ]; then
              echo "::error::Manca il secret $v — vedi docs/INSTALL-iOS.md"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: Genera progetto Xcode (XcodeGen)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          make app

      # Ricetta ufficiale GitHub "Installing an Apple certificate on macOS runners".
      - name: Importa certificato e provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PW="${KEYCHAIN_PASSWORD:-angavu-ci-temp}"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KC_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # Il nome del profilo serve a xcodebuild per la firma manuale: lo estraiamo dal
      # profilo stesso, così l'utente non deve ricopiarlo a mano in un secret.
      - name: Ricava nome del provisioning profile
        id: pp
        run: |
          PLIST=$(security cms -D -i "$RUNNER_TEMP/build_pp.mobileprovision")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$PLIST")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Provisioning profile: $NAME"

      - name: Archivia (Release, firma manuale)
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project App/Angavu.xcodeproj \
            -scheme Angavu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Angavu.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.pp.outputs.name }}" \
            CODE_SIGN_IDENTITY="Apple Development"

      - name: Esporta .ipa (metodo development)
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PP_NAME: ${{ steps.pp.outputs.name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.angavu.app</key><string>${PP_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Angavu.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Carica l'artefatto .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Angavu-ios-development-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Pulizia keychain e profilo (sempre)
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.mobileprovision" || true
