# Genera un .ipa NON firmato dell'app, scaricabile come artefatto.
#
# Perché: installare Angavu sul proprio iPhone SENZA Apple Developer Program
# (99 $/anno) e SENZA un Mac. La compilazione avviene sul runner macOS di GitHub
# (il "Mac in cloud"); la FIRMA + installazione le fai poi con un tool gratuito
# (Sideloadly o AltStore/SideStore) e un Apple ID gratuito, da un PC Windows/Linux.
# Vedi docs/INSTALL-DEV-IPHONE.md.
#
# Manuale (workflow_dispatch): non consuma minuti a ogni push. Lancialo da
# GitHub → Actions → "Build unsigned IPA" → Run workflow.

name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    name: unsigned .ipa (device)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Genera progetto Xcode (XcodeGen)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          make app

      - name: Build per device (senza firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project App/Angavu.xcodeproj \
            -scheme Angavu \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Impacchetta in .ipa non firmato
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Angavu.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App non trovata in $APP_PATH"; ls -R build/Build/Products || true; exit 1
          fi
          rm -rf Payload Angavu-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # Impacchetta con `ditto` (lo zip canonico di Apple, come l'export Xcode):
          # più compatibile col lettore ZIP dei sideloader (ZIPFoundation/AltStore)
          # del classico `zip -r`, che può produrre archivi rifiutati con errore di
          # «formato non adatto» pur avendo struttura corretta.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Angavu-unsigned.ipa
          echo "IPA creato:"; ls -lh Angavu-unsigned.ipa

      - name: Verifica formato .ipa (oracolo per sideload/AltStore)
        run: |
          set -euo pipefail
          rm -rf _verify && mkdir _verify
          unzip -q Angavu-unsigned.ipa -d _verify
          APP="_verify/Payload/Angavu.app"
          [ -d "$APP" ] || { echo "::error::Payload/Angavu.app assente nell'.ipa"; exit 1; }
          PLIST="$APP/Info.plist"
          [ -f "$PLIST" ] || { echo "::error::Info.plist assente nell'app"; exit 1; }
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null || true; }
          # L'eseguibile dev'esserci ed essere un Mach-O (non uno stub).
          EXE="$(pb CFBundleExecutable)"
          [ -n "$EXE" ] && [ -f "$APP/$EXE" ] || { echo "::error::eseguibile '$EXE' assente"; exit 1; }
          file "$APP/$EXE" | grep -q "Mach-O" || { echo "::error::'$EXE' non è un Mach-O"; exit 1; }
          # Chiavi che iOS/AltStore pretendono in un'app device ben formata.
          for K in MinimumOSVersion CFBundleIdentifier CFBundleExecutable UIDeviceFamily \
                   CFBundleSupportedPlatforms DTPlatformName; do
            V="$(pb "$K")"
            [ -n "$V" ] || { echo "::error::Info.plist manca la chiave '$K' (richiesta da iOS/AltStore)"; exit 1; }
            echo "  $K = $V"
          done
          # Deve essere un build DEVICE (iPhoneOS), non simulatore.
          pb CFBundleSupportedPlatforms | grep -q "iPhoneOS" \
            || { echo "::error::non è un build device: manca iPhoneOS in CFBundleSupportedPlatforms"; exit 1; }
          # Icona app compilata: senza `Assets.car`/CFBundleIcons la firma dei
          # sideloader (AltStore/Sideloadly) può fallire l'installazione.
          [ -f "$APP/Assets.car" ] || { echo "::error::Assets.car assente: l'app non ha icona"; exit 1; }
          # Il plist dev'essere parseabile come property list: è ESATTAMENTE ciò che
          # fa AltStore all'import (un fallimento qui = «isn't in the correct format»).
          plutil -lint "$PLIST" || { echo "::error::Info.plist non è un plist valido (plutil -lint)"; exit 1; }
          echo "Struttura .ipa:"; unzip -l Angavu-unsigned.ipa | sed -n '1,40p'
          echo "--- Contenuto .app (per diagnosi icona/asset) ---"; find "$APP" -maxdepth 2 -print
          echo "--- Info.plist (xml) ---"; plutil -convert xml1 -o - "$PLIST"
          echo "OK: .ipa ben formato per il sideload."

      - name: Carica l'artefatto .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Angavu-unsigned-ipa
          path: Angavu-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
