# CI — l'oracolo Apple in cloud (apple-skills possiede il verdetto).
#
# Gira su un runner macOS ospitato da GitHub (Xcode + Swift + SwiftLint + simulatori
# preinstallati): è il "confine Apple" senza possedere un Mac. "Verde" = esito di
# questi comandi, mai una frase dell'LLM (L-COL-002/006).
#
# Nota minuti: su repo PRIVATO i minuti macOS contano ×10 (Free ~200 min-macOS/mese).
# Per risparmiare: il job app-iOS è separato e puoi disattivarlo, oppure rendi il
# repo pubblico (minuti macOS gratis).

name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
    # I commit di sola documentazione NON innescano la CI (risparmio minuti macOS).
    # Se un push tocca anche codice/config, gira comunque (paths-ignore salta solo
    # quando TUTTI i file cambiati combaciano).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "blueprint/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Oracolo principale: build + test + lint del package SwiftPM. Veloce (~pochi min).
  swiftpm:
    name: swift build/test/lint (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version || true

      # Oracolo dead-code (knip→) e regressione/conformità (target_tests).
      - name: Build (warnings-as-errors)
        run: make build

      - name: Test (target_tests + regressione)
        run: make test

      # Oracolo di stile/dead-code/no-force-unwrap (T-003).
      - name: SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then brew install swiftlint; fi
          make lint

  # Verifica che l'APP iOS compili per simulatore (senza firma). Più pesante:
  # genera il progetto con XcodeGen e builda con xcodebuild.
  ios-app:
    name: build app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Genera progetto Xcode (XcodeGen)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          make app

      - name: Build per simulatore (no signing)
        run: |
          xcodebuild \
            -project App/Angavu.xcodeproj \
            -scheme Angavu \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  # FSE-J0 (Livello B) — ESEGUE l'app su un Simulatore CONCRETO: `xcodebuild test` col
  # target UITest + foto seminate via `xcrun simctl addmedia`. È ciò che rende il
  # cablaggio (eliminazione reale, ciclo di vita) verificabile in CI SENZA il device
  # dell'utente. Più pesante (avvia il Simulatore ed esegue l'app): come `ios-app`,
  # separato e disattivabile per risparmiare minuti macOS.
  ios-uitest:
    name: UITest app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Genera progetto Xcode (XcodeGen)
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          make app

      - name: Crea e avvia il Simulatore
        id: sim
        run: |
          set -euo pipefail
          # Runtime iOS più recente disponibile sul runner (Xcode preinstallato).
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          echo "Runtime scelto: $RUNTIME"
          # Device concreto (es. iPhone 16); fallback al primo iPhone disponibile.
          DEVICE_TYPE="iPhone 16"
          if ! xcrun simctl list devicetypes | grep -q "$DEVICE_TYPE"; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes | grep -Eo 'iPhone [0-9]+' | tail -1)
          fi
          echo "Device scelto: $DEVICE_TYPE"
          UDID=$(xcrun simctl create "angavu-uitest" "$DEVICE_TYPE" "$RUNTIME")
          echo "UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Semina foto di fixture (simctl addmedia)
        run: |
          set -euo pipefail
          # Immagine sintetica di fixture (mai dati reali); zero rete. Riusata dai
          # test end-to-end di FSE-J1 (eliminazione reale).
          xcrun simctl addmedia "${{ steps.sim.outputs.udid }}" fixtures/uitest-seed.png
          # FSE-K3: una SECONDA copia identica → un duplicato esatto REALE nella libreria,
          # così «Duplicati esatti» ha un risultato non vuoto da persistere e ritrovare
          # dopo il cold relaunch (RelaunchCategoryCacheUITests).
          xcrun simctl addmedia "${{ steps.sim.outputs.udid }}" fixtures/uitest-seed.png

      - name: Pre-concede l'accesso alla libreria foto (best-effort)
        run: |
          # FSE-K3: evita l'alert di sistema durante la scansione del UITest. Best-effort:
          # se il grant non è applicabile prima dell'installazione, il test gestisce
          # l'alert da Springboard.
          xcrun simctl privacy "${{ steps.sim.outputs.udid }}" grant photos com.angavu.app || true

      - name: xcodebuild test (UITest sul Simulatore)
        run: |
          set -euo pipefail
          xcodebuild test \
            -project App/Angavu.xcodeproj \
            -scheme Angavu \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
